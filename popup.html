<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="popupTitle">NextUp – Today's Releases</title>
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://graphql.anilist.co" />
    <link rel="stylesheet" href="popup.css" />
    <link rel="icon" type="image/png" href="assets/icon-32.png" />
  </head>

  <body>
    <header>
      <div class="logo">
        <img src="assets/icon-32.png" alt="NextUp" class="logo-icon" />
        <h1>NextUp</h1>
      </div>

      <div id="controls">
        <select id="regionSelector" class="header-select">
          <option value="GLOBAL" data-i18n="regionGlobal">Global</option>
          <option value="LOCAL" data-i18n="regionLocal">Regional</option>
        </select>

        <div class="date-controls">
          <button id="prevDay" class="day-btn">&lt;</button>
          <span id="dateLabel"></span>
          <button id="nextDay" class="day-btn">&gt;</button>
        </div>
      </div>
    </header>

    <section id="apiKeySection" class="apiKeySection hidden">
      <label>
        <span data-i18n="apiKeyLabel">Enter your TMDB API Key</span>
        <input
          id="tmdbApiKeyInput"
          data-i18n-placeholder="apiKeyPlaceholder"
          placeholder="Paste TMDB key here..."
        />
      </label>
      <button id="saveApiKeyBtn" data-i18n="apiKeySaveBtn">Save Key</button>
      <small id="apiKeyStatus"></small>
    </section>

    <nav id="tabs">
      <button data-tab="movies" class="active" data-i18n="tabMovies">Movies</button>
      <button data-tab="tv" data-i18n="tabTv">TV Shows</button>
      <button data-tab="anime" data-i18n="tabAnime">Anime</button>
    </nav>

    <input
      id="searchInput"
      type="search"
      data-i18n-placeholder="searchPlaceholder"
      placeholder="Search this day's releases..."
      autocomplete="off"
      spellcheck="false"
    />

    <main id="content">
      <div id="movies" class="tab-panel active">
        <div id="moviesLoader" class="loader">
          <div class="loader-icon"></div>
        </div>
        <div class="list" id="moviesList"></div>
        <div class="empty hidden" id="moviesEmpty" data-i18n="emptyMovies">
          No movie releases found for today.
        </div>
      </div>

      <div id="tv" class="tab-panel">
        <div id="tvLoader" class="loader">
          <div class="loader-icon"></div>
        </div>
        <div class="list" id="tvList"></div>
        <div class="empty hidden" id="tvEmpty" data-i18n="emptyTv">
          No TV releases found for today.
        </div>
      </div>

      <div id="anime" class="tab-panel">
        <div id="animeLoader" class="loader">
          <div class="loader-icon"></div>
        </div>
        <div class="list" id="animeList"></div>
        <div class="empty hidden" id="animeEmpty" data-i18n="emptyAnime">
          No anime releases found for today.
        </div>
      </div>
    </main>

    <footer>
      <small>
        <span data-i18n="footerPoweredBy">Powered by TMDB & AniList —</span>
        <a
          href="https://github.com/ujjwal313"
          target="_blank"
          data-i18n="footerGithubLink"
          >GitHub</a
        >
      </small>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
